name: Import approved Drive images
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client google-auth
      - name: Import images
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import io, json, os, re
          from pathlib import Path
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          raw = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON")
          folder = os.environ.get("DRIVE_FOLDER_ID")
          if not raw or not folder:
              raise SystemExit("Configure the service account secret and folder variable.")
          creds = service_account.Credentials.from_service_account_info(json.loads(raw), scopes=["https://www.googleapis.com/auth/drive.readonly"])
          drive = build("drive", "v3", credentials=creds)
          out = Path("images")
          out.mkdir(exist_ok=True)
          expected = set()
          token = None
          while True:
              page = drive.files().list(q=f"'{folder}' in parents and trashed = false", fields="nextPageToken,files(id,name,mimeType)", pageSize=100, pageToken=token).execute()
              for f in page.get("files", []):
                  name = f["name"]
                  if f["mimeType"] not in ("image/png", "image/jpeg") or not re.fullmatch(r"[A-Za-z0-9._-]+", name):
                      continue
                  expected.add(name)
                  buf = io.BytesIO()
                  downloader = MediaIoBaseDownload(buf, drive.files().get_media(fileId=f["id"]))
                  done = False
                  while not done:
                      _, done = downloader.next_chunk()
                  dest = out / name
                  if not dest.exists() or dest.read_bytes() != buf.getvalue():
                      dest.write_bytes(buf.getvalue())
              token = page.get("nextPageToken")
              if not token:
                  break
          # Only delete local image files after a complete successful Drive listing and download.
          for existing in out.iterdir():
              if existing.is_file() and existing.suffix.lower() in (".png", ".jpg", ".jpeg") and existing.name not in expected:
                  existing.unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/
          if ! git diff --cached --quiet; then
            git commit -m "Import approved Drive images"
            git push
          fi
